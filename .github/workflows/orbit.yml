name: Orbit Support

on:
  workflow_dispatch:

jobs:
  start-orbit:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Iniciar Orbit
        run: node index.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ORBIT_AI_BASE_URL: ${{ secrets.ORBIT_AI_BASE_URL }}
          ORBIT_AI_API_KEY: ${{ secrets.ORBIT_AI_API_KEY }}
          ORBIT_AI_MODEL: ${{ secrets.ORBIT_AI_MODEL }}
